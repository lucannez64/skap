services:
  # Service pour générer le certificat CA si nécessaire
  ca-generator:
    image: alpine:latest
    command: >
      sh -c '
        if [ ! -f /certs/ca.pem ]; then
          echo "Génération du certificat CA..."
          apk add --no-cache openssl
          openssl req -x509 -newkey rsa:4096 -keyout /certs/ca.key -out /certs/ca.pem -days 3650 -nodes -subj "/CN=skap-postgres/O=Skap/C=FR" -addext "subjectAltName=DNS:postgres,DNS:localhost,IP:127.0.0.1"
          echo "Certificat CA généré avec succès."
        else
          echo "Le certificat CA existe déjà."
        fi
      '
    volumes:
      - ca-cert:/certs:rw
    networks:
      - skap-network

  # Service PostgreSQL
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}  # SECURITY: Change default password
      - POSTGRES_DB=${POSTGRES_DB:-skap}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - ca-cert:/var/lib/postgresql/certs:ro
    restart: unless-stopped
    networks:
      - skap-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - ca-generator

  # Service Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}  # SECURITY: Set Redis password
    command: >
      sh -c '
        if [ -n "$REDIS_PASSWORD" ]; then
          redis-server --requirepass "$REDIS_PASSWORD"
        else
          redis-server
        fi
      '
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - skap-network
    healthcheck:
      test: >
        sh -c '
          if [ -n "$REDIS_PASSWORD" ]; then
            redis-cli -a "$REDIS_PASSWORD" ping
          else
            redis-cli ping
          fi
        '
      interval: 10s
      timeout: 5s
      retries: 5
      
  # Service Skap Server
  skap-server:
    image: hirew/skap-server:latest
    ports:
      - "3030:3030"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-skap}
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}  # SECURITY: Redis authentication
      - BASE64_KEY=${BASE64_KEY:-}  # SECURITY: Must be provided via environment variable
    volumes:
      - ca-cert:/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - skap-network
    command: ["/app/skap-server"]
  
volumes:
  postgres-data:
  redis-data:
  ca-cert:

networks:
  skap-network:
    driver: bridge